[project]
name = "pokedata"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pathlib>=1.0.1",
    "polars>=2.0.0",
    "psycopg>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
