services:
  db:
    image: postgres:15
    container_name: Poke_Postgre
    restart: unless-stopped
    ports:
    - 5432:5432
    volumes:
    - poke_data:/var/lib/postgresql/data
    environment:
    - POSTGRES_USER=${DB_USER}
    - POSTGRES_PASSWORD=${DB_PASS}
    - POSTGRES_DB=${DB_NAME}

    network_mode: host
  
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.5.0
    container_name: Poke_DBT
    ports:
    - 8080:8080
    volumes:
    - ./dbt:/usr/app
    environment:
    - DBT_PROFILES_DIR=/usr/app
    - DBT_PROJECT_DIR=/usr/app
    profiles:
    - cli
    command: docs serve --port 8085
    depends_on:
    - db
    env_file:
      - .env

    network_mode: host

  metabase:
    image: metabase/metabase:latest
    container_name: Poke_metabase
    restart: always
    ports:
    - 3000:3000
    environment:
    - JAVA_OPTS=-Xmx512m
    depends_on:
    - db

    network_mode: host

volumes:
  poke_data: {}
networks:
  poke-net: {}
