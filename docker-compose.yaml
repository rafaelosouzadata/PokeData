  metabase:
      image: metabase/metabase:latest
      container_name: "Poke_metabase"
      restart: always

      ports:
        - "3000:3000"
      environment:
        - JAVA_OPTS=-Xmx512m
      depends_on:
        - db

      networks:
        - poke-net

