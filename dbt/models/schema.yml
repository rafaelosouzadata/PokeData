version: 2

models:
  - name: stg_pokemon
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: name
        tests:
          - unique
          - not_null

  - name: stg_species
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: name
        tests:
          - unique
          - not_null
  
  - name: int_pokemon_types
    columns:
      - name: id_pokemon
        tests:
          - relationships:
              to: ref('stg_pokemon')
              field: id_pokemon
    columns:
      - name: id_type
        tests:
          - relationships:
              to: ref('dim_types')
              field: id_type